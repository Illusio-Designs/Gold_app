name: d2c iOS Build (TestFlight)

# Builds a signed App Store archive of the Amrut D2C app on a macOS runner and
# uploads it to TestFlight via fastlane. Signing uses an App Store Connect API
# key + fastlane match (shared cert store with b2b; a d2c profile is created on
# the first run).
#
# Reuses the SAME repository secrets as the b2b iOS workflow:
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_CONTENT   (App Store Connect API key)
#   MATCH_PASSWORD                                  (cert-store passphrase)
#
# FIRST-TIME prerequisites on Apple's side (see d2c/ios/fastlane/Fastfile):
#   • Create the app record for bundle id `com.Amrutt.d2c` in App Store Connect.
#   • Accept any pending agreement (Business / Agreements, Tax, and Banking).
#
# Trigger: manual, OR a push touching d2c on the feature branch.

on:
  workflow_dispatch:
  push:
    branches: [claude/code-updates-review-4lp01q]
    paths:
      - "d2c/**"
      - ".github/workflows/d2c-ios-build.yml"

concurrency:
  group: d2c-ios-testflight-build
  cancel-in-progress: true

# match stores the encrypted signing certs in the `fastlane-certs` branch of
# this repo, so the job needs write access to push the new d2c profile.
permissions:
  contents: write

jobs:
  build:
    name: Build & upload d2c to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: d2c/package-lock.json

      - name: Select latest Xcode (26, iOS 26 SDK — required by App Store)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby (for fastlane + CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: d2c/ios

      - name: Install JS dependencies
        working-directory: d2c
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: CocoaPods install
        working-directory: d2c/ios
        run: bundle exec pod install --repo-update

      - name: Fastlane beta (build + upload to TestFlight)
        working-directory: d2c/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amrut-d2c-ios-ipa
          path: d2c/ios/build/Amrut.ipa
          if-no-files-found: ignore
          retention-days: 14
