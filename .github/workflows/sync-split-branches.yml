name: Sync split branches

# Automatically keeps the component "split" branches in sync with main.
# Whenever main changes, each split branch is regenerated to contain ONLY
# its own folder (at the same path), mirroring the latest code from main.
#
#   backend      <-  Backend/
#   dashboard    <-  dashboard/     (admin web dashboard)
#   b2b          <-  b2b/           (B2B / wholesale app)
#   d2c          <-  d2c/           (D2C / consumer app)
#
# Can also be run manually from the Actions tab (workflow_dispatch).
# Note: the old `application` branch is superseded by `b2b` and can be deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two syncs at once.
concurrency:
  group: sync-split-branches
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: backend
            keep: Backend
          - branch: dashboard
            keep: dashboard
          - branch: b2b
            keep: b2b
          - branch: d2c
            keep: d2c
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild ${{ matrix.branch }} branch from main (keep only ${{ matrix.keep }})
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Start a fresh branch pointing at the current main.
          git checkout -B "${{ matrix.branch }}" main

          # Remove everything, then restore only the target folder from main.
          git rm -r --quiet .
          git checkout main -- "${{ matrix.keep }}"

          # These component branches contain no dashboard, so Vercel's build
          # errors on them. A repo-root vercel.json disables Git deployments so
          # Vercel stops creating (failing) preview builds for these branches.
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > vercel.json

          git add -A

          # Skip if nothing actually changed for this component.
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.branch }} — skipping."
            exit 0
          fi

          git commit -m "chore: sync ${{ matrix.branch }} from main (${GITHUB_SHA::7}) [skip ci]"
          git push --force origin "${{ matrix.branch }}"
