name: Android Build (test APK)

# Builds a standalone, installable test APK of the Amrut B2B app on GitHub's
# Linux runner (which ships the Android SDK). The APK is a *release* build
# (JS bundled via Hermes, so no Metro server needed) signed with the debug
# keystore, so anyone can install it on a device for testing.
#
# Get the APK: Actions tab → this run → "Artifacts" → amrut-test-apk.
#
# Triggers: automatically when the app or this workflow changes on main, and
# manually via "Run workflow" (workflow_dispatch).

on:
  workflow_dispatch:
  push:
    # Test APKs build from the feature branch or on demand (workflow_dispatch).
    # Merges to main deploy the backend but intentionally do NOT build an APK.
    branches: [claude/code-updates-review-4lp01q]
    paths:
      - "b2b/**"
      - ".github/workflows/android-build.yml"

# Only the latest build matters — cancel older in-flight runs.
concurrency:
  group: android-apk-build
  cancel-in-progress: true

# Needed to publish the APK to a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: b2b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: b2b/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Ensure Android 16 (API 36) platform + build-tools are present — the app
      # targets API 36 (Google Play policy). Explicit install so the build never
      # depends on whatever the runner image happens to preinstall.
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Gradle assembleRelease (signed with debug key)
        working-directory: b2b/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PMYAPP_RELEASE_STORE_FILE=debug.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD=android \
            -PMYAPP_RELEASE_KEY_ALIAS=androiddebugkey \
            -PMYAPP_RELEASE_KEY_PASSWORD=android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amrut-test-apk
          path: b2b/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Production App Bundle (.aab) — signed with the REAL release key
      # (amrut-release-key.keystore via gradle.properties, NOT the debug key),
      # this is the file you upload to the Play Console Production track.
      - name: Gradle bundleRelease (production AAB, release-signed)
        working-directory: b2b/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload production AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: amrut-release-aab
          path: b2b/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # Publish the APK to a rolling GitHub Release so it always has a stable
      # download link on the repo's Releases page (tag: android-test-latest).
      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-latest
          name: "Amrut B2B — Test APK (build ${{ github.run_number }})"
          body: |
            Standalone test APK of the Amrut B2B app.

            - Commit: `${{ github.sha }}`
            - Build: #${{ github.run_number }}
            - Install `app-release.apk` on any Android device (enable "install from unknown sources").

            This release is updated automatically on every app change to `main`.
          prerelease: true
          make_latest: "true"
          files: b2b/android/app/build/outputs/apk/release/app-release.apk
