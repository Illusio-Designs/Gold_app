name: Android Build (test APK)

# Builds a standalone, installable test APK of the Amrut B2B app on GitHub's
# Linux runner (which ships the Android SDK). The APK is a *release* build
# (JS bundled via Hermes, so no Metro server needed) signed with the debug
# keystore, so anyone can install it on a device for testing.
#
# Get the APK: Actions tab → this run → "Artifacts" → amrut-test-apk.
#
# Triggers: automatically when the app or this workflow changes on main, and
# manually via "Run workflow" (workflow_dispatch).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Frontend/Amrut/**"
      - ".github/workflows/android-build.yml"

# Only the latest build matters — cancel older in-flight runs.
concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Frontend/Amrut
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/Amrut/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Gradle assembleRelease (signed with debug key)
        working-directory: Frontend/Amrut/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PMYAPP_RELEASE_STORE_FILE=debug.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD=android \
            -PMYAPP_RELEASE_KEY_ALIAS=androiddebugkey \
            -PMYAPP_RELEASE_KEY_PASSWORD=android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amrut-test-apk
          path: Frontend/Amrut/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
