name: iOS Build (TestFlight)

# Builds a signed App Store archive of the Amrut B2B app on a macOS runner and
# uploads it to TestFlight via fastlane. Signing uses an App Store Connect API
# key + Xcode automatic signing (no certificates/passwords stored in the repo).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       App Store Connect API key id (e.g. ABC123DEF4)
#   ASC_ISSUER_ID    App Store Connect issuer id (a UUID)
#   ASC_KEY_CONTENT  the FULL text of the AuthKey_XXXX.p8 file, pasted as-is
#                    (open the .p8 in a text editor, copy everything incl. the
#                    -----BEGIN/END PRIVATE KEY----- lines)
#
# Prerequisites you do ONCE on Apple's side:
#   • App Store Connect → Users and Access → Integrations → App Store Connect
#     API → generate a key with "App Manager" access → download the .p8.
#   • App Store Connect → create the app record for bundle id `com.Amrutt`.
#   • (Push) Certificates, IDs & Profiles → Keys → create an APNs Auth Key
#     (.p8) → upload it to the amrut-jewels Firebase project (Cloud Messaging).
#
# Trigger: manual (workflow_dispatch) OR a push touching iOS on the feature
# branch (now that the Apple secrets are set, so it won't auto-fail).

on:
  workflow_dispatch:
  push:
    branches: [claude/code-updates-review-4lp01q]
    # Any app change rebuilds iOS — the JS/src is bundled into the iOS app too,
    # so watching only b2b/ios/** missed JS-only fixes (they built Android but
    # not iOS). Match android-build.yml: rebuild on any b2b change.
    paths:
      - "b2b/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-testflight-build
  cancel-in-progress: true

# match stores the encrypted signing certs in the `fastlane-certs` branch of
# this repo, so the job needs write access to push them.
permissions:
  contents: write

jobs:
  build:
    name: Build & upload to TestFlight
    # macos-15 ships Xcode 16 (Swift 6), required by the pinned Firebase pods
    # which use `sending` / access-level-on-imports (Swift 6 only).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: b2b/package-lock.json

      # Apple now REQUIRES the iOS 26 SDK (Xcode 26) for App Store uploads
      # (altool 409 "must be built with the iOS 26 SDK"). Xcode 26 earlier
      # failed only due to the react_runtime modulemap clash — now fixed by
      # scoping modular headers to Firebase — so latest-stable (26.x) should
      # both build and satisfy Apple's SDK requirement.
      - name: Select latest Xcode (26, iOS 26 SDK — required by App Store)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby (for fastlane + CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: b2b/ios

      - name: Install JS dependencies
        working-directory: b2b
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: CocoaPods install
        working-directory: b2b/ios
        run: bundle exec pod install --repo-update

      - name: Fastlane beta (build + upload to TestFlight)
        working-directory: b2b/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # match: passphrase for the encrypted certs, and the storage git URL
          # (this repo's fastlane-certs branch) authenticated with the job token.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amrut-ios-ipa
          path: b2b/ios/build/Amrut.ipa
          if-no-files-found: ignore
          retention-days: 14
