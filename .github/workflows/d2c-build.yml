name: D2C Android Build (test APK)

# Builds a standalone, installable test APK of the Amrut D2C (consumer) app.
# Same approach as the B2B workflow: a release build (Hermes-bundled) signed
# with the debug keystore, published to a rolling GitHub Release so it always
# has a stable download link (tag: android-d2c-test-latest).
#
# Get the APK: Actions tab → this run → "Artifacts" → amrut-d2c-test-apk, or
# the Releases page.

on:
  workflow_dispatch:
  push:
    branches: [claude/code-updates-review-4lp01q]
    paths:
      - "d2c/**"
      - ".github/workflows/d2c-build.yml"

concurrency:
  group: d2c-apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build D2C test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: d2c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: d2c/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        # npm ci falls back to install so a lockfile that is momentarily out of
        # sync (e.g. a freshly added native dep) still resolves.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Gradle assembleRelease (signed with debug key)
        working-directory: d2c/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PMYAPP_RELEASE_STORE_FILE=debug.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD=android \
            -PMYAPP_RELEASE_KEY_ALIAS=androiddebugkey \
            -PMYAPP_RELEASE_KEY_PASSWORD=android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amrut-d2c-test-apk
          path: d2c/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-d2c-test-latest
          name: "Amrut D2C — Test APK (build ${{ github.run_number }})"
          body: |
            Standalone test APK of the Amrut D2C (consumer) app.

            - Commit: `${{ github.sha }}`
            - Build: #${{ github.run_number }}
            - Install `app-release.apk` on any Android device (enable "install from unknown sources").
          prerelease: true
          make_latest: "false"
          files: d2c/android/app/build/outputs/apk/release/app-release.apk
