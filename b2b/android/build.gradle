buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-otp-verify (OtpVerifyModule.java) references the legacy
// Auth.GOOGLE_SIGN_IN_API, which Google removed in play-services-auth 21.x.
// The library module resolves play-services-auth on its OWN classpath, so a
// force in app/build.gradle never reaches it — it must be applied to every
// project. Pin 20.7.0 (last version with the legacy Auth API) everywhere so
// the :react-native-otp-verify module compiles.
allprojects {
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-auth:20.7.0'
        }
    }
}
